<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Charts</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px;
            background: #f5f7fb;
            color: #233149;
            font-family: system-ui, sans-serif;
        }

        main {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        figure {
            margin: 0;
            overflow: hidden;
            border: 1px solid #dce3ed;
            border-radius: 10px;
            background: #fff;
        }

        .chart-space {
            min-height: 320px;
        }

        figcaption {
            padding: 12px 16px;
            border-top: 1px solid #dce3ed;
            font-weight: 600;
        }

        @media (max-width: 650px) {
            body {
                padding: 20px;
            }

            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <figure>
            <div class="chart-space" aria-label="Space for chart 1"></div>
            <figcaption>Chart 1</figcaption>
        </figure>
        <figure>
            <div class="chart-space" aria-label="Space for chart 2"></div>
            <figcaption>Chart 2</figcaption>
        </figure>
    </main>
</body>
</html>
