<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Charts</title>
    <style>
        :root {
            color-scheme: light;
            --page: #eef3f9;
            --surface: #ffffff;
            --ink: #1d2b41;
            --muted: #64748b;
            --line: #d6deec;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--page);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .charts {
            display: grid;
            gap: 24px;
        }

        .chart {
            margin: 0;
            padding: 18px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
        }

        .chart img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 10px;
            background: #fff;
        }

        figcaption {
            margin-top: 12px;
            color: var(--muted);
            font-size: 0.96rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }
    </style>
</head>
<body>
    <main>
        <section class="charts" aria-label="Rocket charts">
            <figure class="chart">
                <img src="chart1forrocket.png" alt="Air time data chart">
                <figcaption>Air Time Data</figcaption>
            </figure>

            <figure class="chart">
                <img src="chart2forrocket.png" alt="Distance from launchpad data chart">
                <figcaption>Distance From Launchpad Data</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
